<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Retain Ubuntu's Latin forms; prefer D2Coding for missing Hangul. -->
  <alias binding="strong">
    <family>@FONT@</family>
    <accept><family>@FALLBACK_FONT@</family></accept>
  </alias>
  <!-- Terminals may query generic monospace when resolving missing glyphs. -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>@FONT@</family><family>@FALLBACK_FONT@</family></prefer>
  </alias>
</fontconfig>
