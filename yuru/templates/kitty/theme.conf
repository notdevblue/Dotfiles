# Include LAST in kitty.conf; behavioral settings stay in the base file.
font_family @FONT@
foreground @FG@
background @BG@
background_opacity 1.0
dynamic_background_opacity no
selection_foreground @BG@
selection_background @MINT@
cursor @MINT@
cursor_text_color @BG@
url_color @MINT@
active_border_color @MINT@
inactive_border_color @SURFACE@
window_padding_width 1
# Muted but distinct ANSI hues; brighter partners remain useful for TUI programs.
color0 @BG@
color1 @ANSI1@
color2 @ANSI2@
color3 @ANSI3@
color4 @ANSI4@
color5 @ANSI5@
color6 @ANSI6@
color7 @FG@
color8 @ANSI8@
color9 @ERROR@
color10 @ANSI10@
color11 @ANSI11@
color12 @ANSI12@
color13 @ANSI13@
color14 @MINT@
color15 @BRIGHT@
