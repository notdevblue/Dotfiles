# SwayFX only. Load after the existing effects configuration.
blur disable
for_window [app_id="^kitty$"] blur enable
for_window [class="^live2d-agent-companion$" window_type="dialog"] blur enable
# Lift only the floating Waybar; regular window shadows stay disabled in the base config.
shadow_blur_radius 8
shadow_color #00000055
shadow_offset 0 2
layer_effects "waybar" shadows enable
