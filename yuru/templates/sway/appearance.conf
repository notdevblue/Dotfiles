# Visual overrides only. Included last by the existing base Sway config.
# Output modes, inputs, gaming/fullscreen rules and session startup remain owned there.
font pango:@BROWSER_FONT@ 11
default_border pixel 1
default_floating_border pixel 1
gaps inner 6
gaps outer 2
# Keep a subtle edge on dark windows, with muted teal for the focused window.
client.focused          @WINDOW_BORDER_FOCUSED@ @SURFACE@ @FG@ @WINDOW_BORDER_FOCUSED@ @WINDOW_BORDER_FOCUSED@
client.focused_inactive @WINDOW_BORDER@ @BG@ @MUTED@ @WINDOW_BORDER@ @WINDOW_BORDER@
client.unfocused        @WINDOW_BORDER@ @BG@ @MUTED@ @WINDOW_BORDER@ @WINDOW_BORDER@
client.urgent           @ERROR@ @SURFACE@ @BRIGHT@ @ERROR@ @ERROR@
client.background      @BG@
output * bg ~/.local/share/yuru-theme/wallpaper.png fill
