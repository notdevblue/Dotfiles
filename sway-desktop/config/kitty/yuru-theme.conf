# Include LAST in kitty.conf; behavioral settings stay in the base file.
font_family Ubuntu Mono
foreground #E1DBD1
background #1E191F
background_opacity 0.75
dynamic_background_opacity yes
selection_foreground #1E191F
selection_background #88D4CC
cursor #88D4CC
cursor_text_color #1E191F
url_color #88D4CC
active_border_color #88D4CC
inactive_border_color #2A222B
window_padding_width 1
# Muted but distinct ANSI hues; brighter partners remain useful for TUI programs.
color0 #1E191F
color1 #B86B79
color2 #9DB791
color3 #C8AF86
color4 #91A6BF
color5 #BA98B4
color6 #78B8B3
color7 #E1DBD1
color8 #786B76
color9 #D58C97
color10 #BACDAA
color11 #DDC8A3
color12 #B3C8E1
color13 #D4B2CD
color14 #88D4CC
color15 #EAECF0

env QT_QPA_PLATFORMTHEME=qt5ct
