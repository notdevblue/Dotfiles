# Super+F10 toggles only the LG OLED's display power; the computer keeps running.
# Match the monitor identity so reconnecting to another port keeps this working.
# No idle wake handler: press the same shortcut again to turn the screen on.
bindsym --locked --inhibited --release --no-repeat $mod+F10 output "LG Electronics LG ULTRAGEAR+ 501NTWG50745" power toggle
