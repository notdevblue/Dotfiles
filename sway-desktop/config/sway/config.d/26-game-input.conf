# Only repeat rate follows game focus. IME state and RAlt roles stay manual.
exec_always --no-startup-id ~/.config/sway/scripts/game-input-guard
# Reset the one-shot toggle state to match the saved Hangul map on config load.
exec_always --no-startup-id ~/.config/sway/scripts/toggle-ralt --reset
bindsym --release --no-repeat $mod+Ctrl+g exec ~/.config/sway/scripts/toggle-ralt
