# Keep the game viewport on the landscape display when the other display is rotated.
workspace 5 output DP-6
assign [class="(?i)^starcitizen[.]exe$"] workspace number 5
for_window [class="(?i)^starcitizen[.]exe$"] floating enable, border none, fullscreen enable, inhibit_idle fullscreen

# Native Wine Wayland windows have app_id instead of X11 class.
assign [title="^Star Citizen[[:space:]]*$"] workspace number 5
for_window [title="^Star Citizen[[:space:]]*$"] floating enable, border none, fullscreen enable, inhibit_idle fullscreen
assign [title="^RSI Launcher$"] workspace number 5
for_window [title="^RSI Launcher$"] floating enable, border none, resize set width 1086 px height 768 px

# The launcher has its own window controls and needs room for its fixed-size dialogs.
for_window [class="(?i)^rsi launcher[.]exe$"] floating enable, border none, resize set width 1086 px height 768 px
