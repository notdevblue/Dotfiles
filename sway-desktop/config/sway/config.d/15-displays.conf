# nwg-displays saves monitor modes/positions and workspace assignments here.
include ~/.config/sway/outputs
# The first workspace assigned to each output becomes its startup workspace.
# Keep these before optional assignments and 25-star-citizen.conf.
workspace 1 output "LG Electronics LG ULTRAGEAR+ 501NTWG50745"
workspace 9 output "Microstep MSI MAG401QR EA5H034100708"
include ~/.config/sway/workspaces
# Keep both displays in SDR; match identities across connector renumbering.
output "Microstep MSI MAG401QR EA5H034100708" hdr off
output "LG Electronics LG ULTRAGEAR+ 501NTWG50745" hdr off
for_window [app_id="nwg-displays"] floating enable
