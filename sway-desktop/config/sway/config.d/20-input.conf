input type:keyboard {
    xkb_layout us
    xkb_options korean:ralt_hangul
    # Keep held game keys stable without changing keyboards on focus events.
    # This also disables held-key repetition on the desktop.
    repeat_rate 0
}
input type:touchpad {
    tap enabled
    dwt enabled
}

# Logitech G502 X LIGHTSPEED: constant pointer response, no acceleration.
input "1133:16543:Logitech_G502_X_LS" {
    accel_profile flat
    pointer_accel 0.0
}
